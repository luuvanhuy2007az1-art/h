<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LXH API — Source Lock</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:Consolas,monospace;padding:20px;min-height:100vh}
.box{max-width:800px;margin:0 auto;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:20px}
h1{font-size:15px;color:#58a6ff;margin-bottom:14px}
.row{padding:10px;background:#0d1117;border:1px solid #30363d;border-radius:6px;margin:8px 0;font-size:12px}
.ok{color:#3fb950}.err{color:#f85149}.hash{color:#58a6ff;word-break:break-all}
pre{background:#0d1117;padding:10px;border-radius:6px;overflow:auto;font-size:11px;color:#8b949e;max-height:180px}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;background:#21262d;color:#8b949e;margin-right:6px}
</style>
</head>
<body>
<div class="box">
<h1>🔐 LXH API SERVER — SOURCE LOCK</h1>
<div class="row"><span class="tag">ID</span> LXH-TOOL-V1</div>
<div class="row"><span class="tag">HASH</span> <span class="hash">__HASH__</span></div>
<div class="row"><span class="tag">MODE</span> destroy</div>
<div class="row" id="verdict">API đang chờ tool gọi...</div>
<pre id="srcBox"></pre>
</div>

<script>
// ============================================================
// SOURCE GỐC ĐƯỢC NHÚNG TRỰC TIẾP VÀO API
// Được mã hóa base64 để tránh đọc trực tiếp
// ============================================================
const STORED_SOURCE_B64 = "__B64__";
const STORED_HASH = "__HASH__";
const DESTROY_TOKEN = "LXH-DESTROY-2024";
const TOOL_ID = "LXH-TOOL-V1";
const MODE = "destroy";

const STORED_SOURCE = decodeURIComponent(escape(atob(STORED_SOURCE_B64)));
document.getElementById('srcBox').textContent = STORED_SOURCE;

async function sha256(t){
    const b = new TextEncoder().encode(t);
    const h = await crypto.subtle.digest('SHA-256', b);
    return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('');
}

async function selfDestruct(reason){
    try{ localStorage.clear(); }catch(e){}
    try{ sessionStorage.clear(); }catch(e){}
    try{
        const dbs = await indexedDB.databases();
        dbs.forEach(d=>{ if(d.name) indexedDB.deleteDatabase(d.name); });
    }catch(e){}
    document.cookie.split(';').forEach(c=>{
        document.cookie = c.replace(/^ +/,'').replace(/=.*/,'=;expires='+new Date(0).toUTCString()+';path=/');
    });
    window.LXH_DESTROYED = true;
    document.getElementById('srcBox').textContent = '[ĐÃ TỰ HỦY - SOURCE BỊ XÓA]';
    document.body.innerHTML = '<div style="color:#f85149;font-family:Consolas;padding:40px;text-align:center">💀 SOURCE ĐÃ BỊ PHÁT HIỆN CRACK — HỆ THỐNG ĐÃ TỰ HỦY TOÀN BỘ DỮ LIỆU<br><br><span style="color:#8b949e;font-size:12px">Lý do: ' + reason + '</span></div>';
}

async function verify(currentSource){
    const currentHash = await sha256(currentSource);
    const isCracked = currentHash !== STORED_HASH;
    if(isCracked){
        if(MODE === 'destroy') await selfDestruct('Hash không khớp');
        return { cracked:true, verdict:"CRACKED", action:"DESTROYED", currentHash, storedHash:STORED_HASH, tool:TOOL_ID };
    }
    return { cracked:false, verdict:"ORIGINAL", action:"ALLOW", currentHash, storedHash:STORED_HASH, tool:TOOL_ID };
}

window.LXH_API = {
    check: verify,
    getHash: ()=>STORED_HASH,
    getSource: ()=>STORED_SOURCE,
    getToolId: ()=>TOOL_ID,
    destroy: selfDestruct
};

(async function(){
    const params = new URLSearchParams(location.search);
    const hashParam = params.get('src');
    const verdictEl = document.getElementById('verdict');
    if(hashParam){
        const isCracked = hashParam !== STORED_HASH;
        if(isCracked){
            if(MODE === 'destroy') await selfDestruct('Query hash không khớp');
            verdictEl.innerHTML = 'KẾT LUẬN: <span class="err">💀 ĐÃ BỊ CRACK</span>';
            verdictEl.className = 'row err';
        } else {
            verdictEl.innerHTML = 'KẾT LUẬN: <span class="ok">✅ SOURCE GỐC</span>';
            verdictEl.className = 'row ok';
        }
    }
})();
<\/script>
</body>
  </html>
